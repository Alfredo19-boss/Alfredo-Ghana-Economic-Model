function seriesOf(k){const m=new Map(),it=LIVE.items[k];if(!it)return[];if(SKEY[k])SER[SKEY[k]].forEach((v,i)=>m.set(MEND[i],v));(it.hist||[]).forEach(p=>{if(Array.isArray(p)&&typeof p[1]=='number')m.set(p[0],p[1])});m.set(it.asOf,it.v);return[...m.entries()].sort((a,b)=>a[0]<b[0]?-1:1)}
function spark(k){const p=seriesOf(k);if(p.length<3)return'';const W=88,H=30,v=p.map(x=>x[1]),mn=Math.min(...v),mx=Math.max(...v),r=mx-mn||1,X=i=>2+i*(W-6)/(p.length-1),Y=x=>3+(mx-x)/r*(H-6),d=v.map((x,i)=>(i?'L':'M')+X(i).toFixed(1)+','+Y(x).toFixed(1)).join('');return`<svg class="spk" viewBox="0 0 ${W} ${H}" aria-hidden="true"><path d="${d}L${X(v.length-1)},${H}L${X(0)},${H}Z" fill="var(--gold)" opacity=".14"/><path d="${d}" fill="none" stroke="var(--gold)" stroke-width="2" stroke-linejoin="round"/><circle cx="${X(v.length-1)}" cy="${Y(v[v.length-1])}" r="3" fill="var(--chalk)"/></svg>`}
const dLabel=d=>new Date(d+'T12:00:00Z').toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
function area(id,k,dp){const el=$(id),p=seriesOf(k);if(!el||p.length<2)return;const W=420,H=150,L=8,R_=8,T=12,B=20,v=p.map(x=>x[1]);let mn=Math.min(...v),mx=Math.max(...v);const pd=(mx-mn||1)*.14;mn-=pd;mx+=pd;const t0=+new Date(p[0][0]),t1=+new Date(p[p.length-1][0]),X=d=>L+(+new Date(d)-t0)/(t1-t0||1)*(W-L-R_),Y=x=>T+(mx-x)/(mx-mn)*(H-T-B),d=p.map((q,i)=>(i?'L':'M')+X(q[0]).toFixed(1)+','+Y(q[1]).toFixed(1)).join('');const lp=p[p.length-1];
 el.setAttribute('viewBox',`0 0 ${W} ${H}`);el.innerHTML=`<defs><linearGradient id="${id}g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--gold)" stop-opacity=".36"/><stop offset="1" stop-color="var(--gold)" stop-opacity="0"/></linearGradient></defs>${[.25,.5,.75].map(u=>`<line x1="${L}" x2="${W-R_}" y1="${T+u*(H-T-B)}" y2="${T+u*(H-T-B)}" stroke="var(--hair)"/>`).join('')}<path d="${d}L${X(lp[0])},${H-B}L${X(p[0][0])},${H-B}Z" fill="url(#${id}g)"/><path class="draw" pathLength="1" d="${d}" fill="none" stroke="var(--gold)" stroke-width="2.4" stroke-linejoin="round"/><circle cx="${X(lp[0])}" cy="${Y(lp[1])}" r="4.5" fill="var(--chalk)" stroke="var(--deep)" stroke-width="2"/><text x="${L}" y="${H-5}" font-size="12" fill="var(--mute)">${dLabel(p[0][0])}</text><text x="${W-R_}" y="${H-5}" text-anchor="end" font-size="12" fill="var(--mute)">${dLabel(lp[0])}</text><line id="${id}x" y1="${T}" y2="${H-B}" stroke="var(--chalk)" opacity="0"/>`;
 el.onpointermove=e=>{const r=el.getBoundingClientRect(),px_=(e.clientX-r.left)/r.width*W;let b=p[0],bd=1e9;p.forEach(q=>{const dx=Math.abs(X(q[0])-px_);if(dx<bd){bd=dx;b=q}});const ln=$(id+'x');ln.setAttribute('x1',X(b[0]));ln.setAttribute('x2',X(b[0]));ln.setAttribute('opacity',.5);showTip(e,`<b>${dLabel(b[0])}</b><br>${fmt(b[1],dp)}${esc(LIVE.items[k].u||'')}`)};el.onpointerleave=()=>{hideTip();const ln=$(id+'x');if(ln)ln.setAttribute('opacity',0)}}

function gauge(l,v,mn,mx,bl,bh,bandL,valTxt,sub){const A=x=>Math.PI*(1-(Math.max(mn,Math.min(mx,x))-mn)/(mx-mn)),pt=(x,r)=>[100+r*Math.cos(A(x)),102-r*Math.sin(A(x))],arc=(a,b,r)=>{const[p,q]=[pt(a,r),pt(b,r)];return`M${p[0].toFixed(1)},${p[1].toFixed(1)}A${r},${r} 0 0 1 ${q[0].toFixed(1)},${q[1].toFixed(1)}`},n=pt(v,62);return`<div class="glass gauge"><label>${l}</label><svg viewBox="0 0 200 118" role="img" aria-label="${l}: ${valTxt}, ${bandL}"><path d="${arc(mn,mx,78)}" fill="none" stroke="rgba(255,255,255,.13)" stroke-width="13" stroke-linecap="round"/><path d="${arc(bl,bh,78)}" fill="none" stroke="var(--green)" stroke-width="13"/><line class="ndl" x1="100" y1="102" x2="${n[0].toFixed(1)}" y2="${n[1].toFixed(1)}" stroke="var(--chalk)" stroke-width="3" stroke-linecap="round"/><circle cx="100" cy="102" r="6" fill="var(--chalk)"/><text x="22" y="116" text-anchor="middle" font-size="11" fill="var(--mute)">${mn}</text><text x="178" y="116" text-anchor="middle" font-size="11" fill="var(--mute)">${mx}</text></svg><b>${valTxt}</b><small>${bandL}</small><small>${sub}</small></div>`}
function ago(iso){const m=Math.max(0,(Date.now()-new Date(iso))/6e4);return m<1?'just now':m<60?Math.round(m)+' min ago':m<1440?Math.round(m/60)+' hr ago':Math.round(m/1440)+' days ago'}
function nextCheck(){const p=new Intl.DateTimeFormat('en-US',{timeZone:'America/New_York',hour:'numeric',minute:'numeric',hourCycle:'h23'}).formatToParts(new Date()),h=+p.find(x=>x.type=='hour').value,mi=+p.find(x=>x.type=='minute').value,now=h*60+mi;let t=mi<17?h*60+17:(h+1)*60+17;return new Date(Date.now()+(t-now)*6e4).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}

 <div class="g2"><section class="glass galm"><div class="hd" style="margin-bottom:6px"><h3>Reported exposure by region</h3><span class="note">Tap a region</span></div><svg id="galMap" viewBox="-5 0 480 668" role="img" aria-label="Galamsey exposure by region"></svg><div class="legend2"><i style="background:linear-gradient(90deg,#1b3442,#c98d3f,#b5412f)"></i><span>Lowest</span><span>Highest</span></div><p class="note">Pins mark places named in reports or known mining areas. Locations are approximate. Exposure tiers are my estimate from named evidence, not official measurements.</p></section><div class="glass stack" id="galPanel"></div></div>
 <div class="glass stack"><h2>Satellite views of reported hotspots</h2><p class="note">These links open real imagery at each location. Sentinel-2 revisits about every five days, clouds permitting, and Worldview shows recent NASA passes. This page cannot show that imagery directly.</p><div class="hotg">${HOT.map(l=>`<div class="hot"><div><b>${esc(l[0])}</b><small>${esc(l[1])} · ${l[2].toFixed(2)}°N ${Math.abs(l[3]).toFixed(2)}°${l[3]<0?'W':'E'}</small></div><div class="hotl">${satLinks(l)}</div></div>`).join('')}</div><a href="https://www.globalforestwatch.org/dashboards/country/GHA/" target="_blank" rel="noopener">Global Forest Watch: tree-cover change for Ghana</a></div>
 <div class="g2"><div class="glass stack"><h3>Enforcement and restoration scenario</h3><div class="ctl"><div class="r"><label for="in-galam">Galamsey brought under control</label><output id="out-galam">${(pol.galam*100).toFixed(0)}%</output></div><input type="range" id="in-galam" data-gal="1" min="0" max="100" step="5" value="${pol.galam*100}"><small>Reaches full effect by 2030. Costs up to GH¢2.5bn a year.</small></div><div class="tiles two">${mtile('GDP effect, 2030',sign(y.gdp-nog.gdp)+'bn','GH¢, against no action')}${mtile('Jobs effect',jobsF(y.jobs-nog.jobs),'farm gains less mining losses')}${mtile('Extra tax, 2030','GH¢'+fmt(y.tax-nog.tax,1)+'bn','formal gold and wider output')}${mtile('Debt to GDP, 2030',(y.debt/y.gdp*100).toFixed(1)+'%','this scenario')}</div><p class="note">Model assumptions, not measured results: full control lifts crops 3%, cocoa 6% and fisheries 5% in exposed regions, while recorded mining output there falls 1.5%. Cleaner water and health savings are not counted. Unrecorded illegal output is outside GDP.</p></div><div class="glass"><h3 style="margin-bottom:8px">Farm output in exposed regions, 2030 (GH¢bn)</h3><div class="bars">${bars(atRisk.slice(0,8),0,v=>'GH¢'+v.toFixed(1)+'bn')}</div><p class="note" style="margin-top:8px">Baseline crop, cocoa, fish and forest output weighted by exposure. This shows scale, not actual losses.</p></div></div>
 <div class="glass"><h3>Wider costs reported</h3><ul class="src"><li>Water: raw water at the Pra needed a switch to a treatment chemical costing about four times as much, and desilting major intakes was estimated at GH¢300m in October 2025. <a href="https://www.graphic.com.gh/business/business-news/when-the-river-turns-brown-everyone-pays.html" target="_blank" rel="noopener">Graphic</a></li><li>Health: mercury exposure from small-scale mining is estimated to cost US$240m a year, and all environmental degradation US$6.3bn a year. Both are World Bank figures cited by <a href="https://paissghana.com/reports/galamsey-nexus.html" target="_blank" rel="noopener">PAISS</a>; the second is not specific to galamsey.</li><li>Tree-cover loss: Western 432,000 ha, Ashanti 411,000 ha, Eastern 246,000 ha. These Global Forest Watch figures cover all causes, not galamsey alone.</li></ul></div>`};

VW.method=()=>`<div class="hd"><h1>Sources and method</h1></div>
 <div class="glass"><p><b>Performance score:</b> the Performance dashboard uses published figures only, with no scenario applied. Yearly data comes from the World Bank and the IMF World Economic Outlook (via DBnomics), and latest readings from Ghana Statistical Service and Bank of Ghana. The method is written out on that dashboard.</p><p>Every other dashboard is a scenario tool that compares choices. It is not an official forecast. Latest readings come from national institutions, directly or as quoted by Ghanaian news when the original page cannot be read. Money is in constant 2025 cedis unless a tile says otherwise.</p></div>

 const prev=i>0?L[i-1]:null,idx=Y.map((yy,q)=>[yy,L[q]]),b=[...idx,['now',L[L.length-1]]].sort((a,c)=>c[1]-a[1]),best=b[0],worst=b[b.length-1],[rl,rh]=scRange();

function scBody(R,rl,rh){const rows=[...R.all].sort((a,b)=>b.s-a.s),top=rows.slice(0,3),low=rows.slice(-3).reverse(),when=scY=='now'?'today':'in '+scY,K=Object.keys(SCG);
 const row=x=>`<button class="scRow" data-sci="${x.it.k}"><span class="scRn"><b>${esc(x.it.l)}</b><small>${scVal(x.v,x.it.u)} · ${esc(scDate(x.d))}${x.live?' · updates by itself':''}</small></span><span class="scRs"><i><em style="width:${x.s.toFixed(1)}%"></em></i><b>${Math.round(x.s)}</b></span></button>`;
 $('scBody').innerHTML=`<section class="scPils"><div class="scSec"><h2>What makes up the score</h2><p class="note">Seven equal parts. Tap one to see every figure, then tap a figure for its full history.</p></div>${SCP.map(([p,n,sub])=>{const P=R.pil[p];if(!P)return'';return`<details class="scPil glass" data-p="${p}"${scOpen.has(p)?' open':''}><summary><span class="scPn"><b>${esc(n)}</b><small>${esc(sub)}</small></span><span class="scPs">${Math.round(P.s)}<small>/100</small></span><i class="scBar"><em style="width:${P.s.toFixed(1)}%"></em></i></summary><div class="scRows">${P.I.map(row).join('')}<button class="chip scPh" data-scp="${p}">History of this part</button></div></details>`}).join('')}</section>
 <section class="g2 scTwo"><div class="glass"><h2>Lifting the score ${when}</h2><div class="scRows">${top.map(row).join('')}</div></div><div class="glass"><h2>Holding it down ${when}</h2><div class="scRows">${low.map(row).join('')}</div></div></section>
 <section class="glass"><h2>How the sectors connect</h2><p class="note">A sector counts for more when it is a bigger share of GDP and when more of the economy buys from it or sells to it.</p><div class="scSecs">${K.map(k=>{const x=R.pil.out&&R.pil.out.I.find(q=>q.it.k==k),t=K.reduce((a,q)=>a+SCD.shares[q]*scLink(q),0);return`<button class="scSc" data-sci="${k}"><b>${SCGN[k]}</b><span>${x?scVal(x.v,x.it.u):'No reading'}</span><dl><div><dt>Share of GDP</dt><dd>${fmt(SCD.shares[k],1)}%</dd></div><div><dt>Linkage</dt><dd>×${fmt(scLink(k),2)}</dd></div><div><dt>Weight in this part</dt><dd>${fmt(SCD.shares[k]*scLink(k)/t*100,0)}%</dd></div><div><dt>Score</dt><dd>${x?Math.round(x.s):'–'}/100</dd></div></dl></button>`}).join('')}</div>
 <h3 style="margin-top:14px">When demand for one sector rises by GH¢100</h3><div class="tblw"><table class="scMx"><thead><tr><th>Output created in</th>${K.map(k=>`<th>${SCGN[k]} demand</th>`).join('')}</tr></thead><tbody>${K.map(g=>`<tr><th>${SCGN[g]}</th>${K.map(h=>{const f=scFlow(g,h)*100;return`<td style="background:rgba(216,180,90,${Math.min(.55,f/190).toFixed(2)})">GH¢${fmt(f,0)}</td>`}).join('')}</tr>`).join('')}</tbody></table></div><p class="note">These links come from the platform’s estimated input-output table, which is not an official Ghana table. They set sector weights only.</p></section>
 <section class="glass"><h2>How Ghana compares</h2><p class="note">Same measures, ranked against eight other African economies instead of Ghana’s own past. Yearly data only, so today’s monthly readings are not used here.</p><p class="scPeerT">Ghana is <b>${SCPEER.rows.findIndex(r=>r.c=='Ghana')+1} of ${SCPEER.rows.length}</b> on the latest figures, and <b>${[...SCPEER.rows].sort((a,b)=>b.avg-a.avg).findIndex(r=>r.c=='Ghana')+1} of ${SCPEER.rows.length}</b> on 2020 to 2024 averages.</p><div class="tblw"><table class="scMx scPeer"><thead><tr><th>Country</th><th>Latest</th><th>2020–24 average</th></tr></thead><tbody>${SCPEER.rows.map(r=>`<tr${r.c=='Ghana'?' class="me"':''}><th>${esc(r.c)}</th><td>${fmt(r.now,0)}</td><td>${fmt(r.avg,0)}</td></tr>`).join('')}</tbody></table></div><div class="scPP">${SCP.map(([k,n])=>SCPEER.parts[k]==null?'':`<div><span>${esc(n)}</span><b>${fmt(SCPEER.parts[k],0)}</b><i class="scBar"><em style="width:${SCPEER.parts[k]}%"></em></i></div>`).join('')}</div><p class="note">The bars are Ghana’s latest scores by part: a score of 100 beats all eight other countries. I chose these countries as West and East African neighbours plus Nigeria and South Africa, so a different group could change the ranking. Some have gaps, such as reserves and bad loans for Côte d’Ivoire and Senegal. The ranking is fixed as of November 2026, and debt figures come from the IMF’s April 2025 outlook, so they predate Ghana’s 2025 fall in debt.</p></section>
 <section class="glass"><h2>Did the score catch past crises?</h2><p class="note">This test ranks each year only against the years before it, as anyone would have seen it then.</p><div class="tblw"><table class="scMx scBt"><thead><tr><th>Event</th><th>Year before</th><th>Event year</th><th>Warning beforehand?</th></tr></thead><tbody>${[['2015 IMF programme, after the cedi’s 2014 fall',2014,2015],['2020 COVID shock',2019,2020],['2022 debt crisis and default',2021,2022]].map(([e,a,b])=>{const A_=scRT(a),B_=scRT(b),w=A_!=null&&A_<45;return`<tr><th>${e}</th><td>${A_==null?'–':fmt(A_,0)}</td><td>${B_==null?'–':fmt(B_,0)}</td><td class="${w?'up':'dn'}">${w?'Yes, below 45':'No'}</td></tr>`}).join('')}</tbody></table></div><p><b>Result: the score records trouble as it arrives, but it is not a reliable early warning.</b> It stood at a normal ${fmt(scRT(2021),0)} the year before the 2022 default. Three events are too few to prove much, and earlier crises such as 2009 lack enough prior data to test. The method was also designed after these events happened.</p></section>
 <section class="glass scHow"><h2>How the figure is worked out</h2><ol><li><b>Same rule for every figure.</b> Each reading is ranked against Ghana’s own yearly results since ${SC0}, the first year all four sectors have growth data.</li><li><b>Score of 0 to 100.</b> A figure scores 80 when it beats 80% of those years. For inflation, debt, bad loans, unemployment and a falling cedi, lower ranks higher.</li><li><b>Sectors are linked.</b> Sector weights are share of GDP times linkage, so nobody chooses them by hand.</li><li><b>Seven equal parts.</b> Figures are averaged within each part, and the parts are averaged into the final score.</li></ol>
 <h3>Does the method change the answer?</h3><p>Trying five other reasonable methods on the same data gives between <b>${Math.round(rl)}% and ${Math.round(rh)}%</b> today. They are: equal weight for every figure, GDP share without linkage, equal sector weights, ranking from 2012, and scoring against the best and worst years instead of ranking.</p>
 <h3>What this figure cannot tell you</h3><ul class="src"><li>It compares Ghana with its own past, not with other countries or with what Ghana could achieve.</li><li>Weighting parts equally is a choice. The range above shows how much it matters.</li><li>Yearly figures ${SCD.fetched?'were last checked for new data on '+new Date(SCD.fetched).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}):'come from the November 2026 download'}. Many are published late, so ${SCD.I.filter(x=>!x.live).length} of the ${SCD.I.length} measures do not reflect this year. Only ${SCD.I.filter(x=>x.live).length} use the latest monthly or daily readings: inflation, the cedi, debt, the current account and bad loans.</li><li>World Bank unemployment is an ILO modelled estimate and is lower than Ghana Statistical Service’s figure, so it is compared only with its own series.</li><li>Not measured, because no usable yearly series was found: galamsey damage, regional gaps, poverty, informal work and tourism since 2015.</li></ul>
